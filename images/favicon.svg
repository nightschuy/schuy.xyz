<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Schuy">
  <defs>
    <!-- Chrome-to-violet orb, lit from the upper left like the work -->
    <radialGradient id="orb" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0"    stop-color="#f4f2ff"/>
      <stop offset="0.22" stop-color="#b9a2ff"/>
      <stop offset="0.55" stop-color="#6a3aff"/>
      <stop offset="1"    stop-color="#1a1a6e"/>
    </radialGradient>
    <linearGradient id="ring" x1="4" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#2b4bff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1"   stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <!-- Near-black tile -->
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>

  <g transform="rotate(-22 32 32)">
    <!-- Back half of the ring, dimmed so it reads as behind the planet -->
    <path d="M4 32 A28 9 0 0 1 60 32" fill="none" stroke="url(#ring)" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
    <!-- Planet -->
    <circle cx="32" cy="32" r="16" fill="url(#orb)"/>
    <!-- Front half of the ring -->
    <path d="M4 32 A28 9 0 0 0 60 32" fill="none" stroke="url(#ring)" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
